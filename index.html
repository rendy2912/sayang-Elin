<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>untuk Elinn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- background layer: gradient + particles -->
  <canvas id="bgCanvas"></canvas>

  <!-- audio -->
  <audio id="bgMusic" src="assets/music.mp3" loop preload="auto"></audio>
  <audio id="bgMusic2" src="assets/music2.mp3" loop preload="auto"></audio>

  <!-- SCREEN 1: pertanyaan -->
  <section id="questionScreen" class="screen">
    <div class="question-wrap">
      <h1 class="question-text">apakah kamu benar benar mencintai ku?</h1>
      <div class="btn-row">
        <button id="noBtn" class="btn btn-no">tidak.</button>
        <button id="yesBtn" class="btn btn-yes">iyaa</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: 100 scene sequence -->
  <section id="sceneScreen" class="screen hidden">
    <div id="sceneMultiWrap" class="scene-multi-wrap"></div>
  </section>

  <!-- SCREEN 3: pesan utama -->
  <section id="finalScreen" class="screen hidden">
    <div class="final-wrap">
      <p id="finalMessage" class="final-message"></p>
      <button id="heartBtn" class="heart-btn" aria-label="tekan hati">
        <span class="heart-shape"></span>
      </button>
      <p id="thanksMessage" class="thanks-message hidden"></p>
    </div>
  </section>

  <!-- SCREEN 4: layar hitam akhir -->
  <div id="blackout"></div>

  <script src="script.js"></script>
</body>
</html>
